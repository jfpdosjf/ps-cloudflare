user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events { worker_connections 8192; multi_accept on; }

http {
  access_log off;
  error_log /dev/stdout warn;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 75s; keepalive_requests 10000;
  server_tokens off; reset_timedout_connection on;
  client_max_body_size 0;

  map $http_upgrade $conn_upgrade { default upgrade; '' ''; }
  # دامنه‌ی واقعی که Worker تو هدر میذاره
  map $http_x_sepnet_host $sp_host { default $http_x_sepnet_host; '' $host; }
  log_format sphost '$http_x_sepnet_host';

  upstream panel { server 127.0.0.1:8000; keepalive 16; }

  gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 8080 default_server;

    location = /healthz { return 200 "ok"; }

    # بکاپ/ریستور (فقط از Worker با توکن)
    location ^~ /_sepnet/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_read_timeout 120s;
      client_max_body_size 200m;
    }

    # صفحه‌ی «در حال آماده‌سازی» وقتی پنل هنوز بالا نیومده
    error_page 502 503 504 /wait.html;
    location = /wait.html {
      root /etc/nginx/sepnet; internal;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "5" always;
    }

    # مسیرهای تصادفی کانفیگ‌ها (genpaths.py می‌سازه)
    include /var/lib/pasarguard/inbounds.inc;

    # پنل، API و اشتراک
    location / {
      proxy_pass http://panel;
      proxy_http_version 1.1;
      proxy_set_header Host $sp_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conn_upgrade;
      proxy_read_timeout 300s;
      access_log /run/sepnet/host.log sphost;
    }
  }
}
